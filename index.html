<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sui Token Creator - 一键发币</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a1a; color: #e0e0f0;
      min-height: 100vh;
    }
    .bg-glow {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(ellipse 80% 60% at 50% -20%, rgba(111,76,255,0.08) 0%, transparent 70%);
    }
    .container { max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px; max-width: 640px; margin: 0 auto;
    }
    .logo {
      font-size: 20px; font-weight: 800;
      background: linear-gradient(135deg, #6f4cff, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .card {
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px; padding: 24px; margin-bottom: 16px;
    }
    .card-title {
      font-size: 15px; font-weight: 700; color: #c8c8e0;
      margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
    }
    .card-step {
      width: 24px; height: 24px; border-radius: 8px;
      background: linear-gradient(135deg, #6f4cff, #a78bfa);
      font-size: 11px; font-weight: 700; color: #fff;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block; font-size: 13px; font-weight: 500;
      color: #9898b0; margin-bottom: 6px;
    }
    .form-group input, .form-group textarea {
      width: 100%; padding: 12px 14px;
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px; color: #e8e8f0; font-size: 14px;
      font-family: inherit; outline: none; transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus {
      border-color: rgba(111,76,255,0.4);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .upload-area {
      border: 1.5px dashed rgba(255,255,255,0.1);
      border-radius: 12px; padding: 28px 16px;
      text-align: center; cursor: pointer; transition: border-color 0.2s;
    }
    .upload-area:hover { border-color: rgba(111,76,255,0.3); }
    .upload-area input[type="file"] { display: none; }
    .upload-icon { font-size: 32px; margin-bottom: 8px; }
    .preview { width: 80px; height: 80px; border-radius: 16px; object-fit: cover; margin: 0 auto 8px; display: none; border: 2px solid rgba(111,76,255,0.3); }
    .btn {
      width: 100%; padding: 16px; border: none; border-radius: 14px;
      background: linear-gradient(135deg, #6f4cff, #a78bfa);
      color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: all 0.25s;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 24px rgba(111,76,255,0.3); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-secondary {
      background: rgba(255,255,255,0.06); color: #a0a0b8;
      border: 1px solid rgba(255,255,255,0.08); margin-top: 8px;
    }
    .cmd-box {
      background: rgba(0,0,0,0.4); border: 1px solid rgba(111,76,255,0.2);
      border-radius: 10px; padding: 16px; margin-top: 12px;
      font-family: 'SF Mono', 'Consolas', monospace; font-size: 12px;
      color: #a78bfa; white-space: pre-wrap; word-break: break-all;
      line-height: 1.6; position: relative;
    }
    .cmd-box .copy-btn {
      position: absolute; top: 8px; right: 8px;
      padding: 4px 10px; border-radius: 6px;
      background: rgba(111,76,255,0.2); color: #a78bfa;
      border: none; font-size: 11px; cursor: pointer;
    }
    .wallet-info {
      padding: 12px 16px; margin-bottom: 16px;
      background: rgba(111,76,255,0.06); border: 1px solid rgba(111,76,255,0.15);
      border-radius: 12px; font-size: 13px; display: none;
    }
    .wallet-info .addr { font-family: monospace; color: #a78bfa; font-size: 12px; }
    .result { display: none; margin-top: 16px; }
    .result a { color: #a78bfa; text-decoration: none; }
    .result a:hover { text-decoration: underline; }
    .step-indicator {
      display: flex; gap: 8px; justify-content: center; margin-bottom: 16px;
    }
    .step-indicator span {
      font-size: 11px; padding: 4px 12px; border-radius: 20px;
      background: rgba(255,255,255,0.03); color: #555570;
    }
    .step-indicator span.active { background: rgba(111,76,255,0.12); color: #a78bfa; }
    .step-indicator span.done { background: rgba(34,197,94,0.1); color: #22c55e; }
    .progress { text-align: center; font-size: 14px; color: #a78bfa; margin-bottom: 12px; min-height: 22px; }
    .footer { text-align: center; font-size: 12px; color: #383840; padding: 24px 0; }
    @media (max-width: 600px) {
      .container { padding: 16px 12px 40px; }
      .card { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <header>
    <div class="logo">✦ Sui Token Creator</div>
    <div>
      <span style="font-size:12px;padding:4px 10px;border-radius:20px;background:rgba(111,76,255,0.1);color:#a78bfa;border:1px solid rgba(111,76,255,0.2);">Testnet</span>
    </div>
  </header>
  <main class="container">

    <!-- Wallet -->
    <div id="wallet-box" class="wallet-info">
      <div>钱包已连接: <span class="addr" id="wallet-addr"></span></div>
    </div>
    <button id="connect-btn" class="btn btn-secondary" style="margin-bottom:16px;">🦊 连接 Sui Wallet</button>

    <!-- Form -->
    <div class="card">
      <div class="card-title"><span class="card-step">1</span> 代币参数</div>
      <div class="form-group">
        <label>Token 名称</label>
        <input id="token-name" placeholder="例如: MyToken" value="MyToken">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Token 符号</label>
          <input id="token-symbol" placeholder="例如: MTK" value="MTK">
        </div>
        <div class="form-group">
          <label>精度</label>
          <input id="token-decimals" type="number" value="9" min="0" max="18">
        </div>
      </div>
      <div class="form-group">
        <label>供应量</label>
        <input id="token-supply" type="number" value="1000000000" min="1">
      </div>
      <div class="form-group">
        <label>Token Logo</label>
        <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
          <input type="file" id="file-input" accept="image/*">
          <img class="preview" id="preview" alt="">
          <div class="upload-icon">🖼️</div>
          <div style="font-size:13px;color:#9898b0;">点击上传图片</div>
        </div>
      </div>
      <div class="form-group">
        <label>描述（可选）</label>
        <textarea id="token-desc" placeholder="描述你的代币..." rows="2"></textarea>
      </div>
    </div>

    <!-- Generate -->
    <div class="card">
      <div class="card-title"><span class="card-step">2</span> 生成发币代码</div>
      <div id="step-indicator" class="step-indicator">
        <span>上传</span>
        <span>生成</span>
        <span>部署</span>
      </div>
      <div id="progress" class="progress"></div>
      <button id="generate-btn" class="btn">✦ 生成发币代码</button>
    </div>

    <!-- Result -->
    <div id="result" class="result card">
      <div style="font-size:15px;font-weight:700;color:#22c55e;margin-bottom:16px;">✅ 生成成功</div>
      <div style="font-size:13px;color:#9898b0;margin-bottom:8px;">复制以下命令在终端中运行：</div>
      <div class="cmd-box" id="cmd-box">
        <button class="copy-btn" onclick="copyCmd()">复制</button>
        <span id="cmd-text"></span>
      </div>
      <div style="margin-top:12px;font-size:12px;color:#686880;">
        <div>📌 需要先安装 Sui CLI</div>
        <div>📌 确保钱包有测试网 SUI</div>
        <div id="explorer-link"></div>
      </div>
    </div>

    <div class="footer">Powered by Sui Network</div>
  </main>

  <script>
    // ====== Pinata 配置（请在下面填入你的 Pinata JWT） ======
    // 去 https://app.pinata.cloud 注册 → API Keys → 复制 JWT
    const PINATA_JWT = '';  // ← 在这里填入你的 Pinata JWT

    // ====== 状态 ======
    let wallet = null;
    let imageCid = '';

    // ====== 上传图片 ======
    async function uploadToIPFS(file) {
      const form = new FormData();
      form.append('file', file);
      const res = await fetch('https://api.pinata.cloud/pinning/pinFileToIPFS', {
        method: 'POST',
        headers: { Authorization: `Bearer ${PINATA_JWT}` },
        body: form,
      });
      const data = await res.json();
      return data.IpfsHash;
    }

    // ====== 图片预览 ======
    document.getElementById('file-input').onchange = function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        document.getElementById('preview').src = ev.target.result;
        document.getElementById('preview').style.display = 'block';
        document.querySelector('.upload-icon').style.display = 'none';
      };
      reader.readAsDataURL(file);
    };

    // ====== 连接钱包 ======
    document.getElementById('connect-btn').onclick = async function() {
      if (!window.suiWallet) {
        alert('请先安装 Sui Wallet 浏览器扩展');
        return;
      }
      try {
        const accounts = await window.suiWallet.requestPermissions();
        const addr = await window.suiWallet.getAccounts();
        document.getElementById('wallet-addr').textContent = addr[0];
        document.getElementById('wallet-box').style.display = 'block';
        wallet = addr[0];
      } catch (e) {
        alert('连接失败: ' + e.message);
      }
    };

    // ====== 生成代码 ======
    document.getElementById('generate-btn').onclick = async function() {
      const btn = this;
      const name = document.getElementById('token-name').value.trim() || 'MyToken';
      const symbol = document.getElementById('token-symbol').value.trim() || 'MTK';
      const decimals = document.getElementById('token-decimals').value || 9;
      const supply = document.getElementById('token-supply').value || '1000000000';
      const desc = document.getElementById('token-desc').value.trim() || name;
      const fileInput = document.getElementById('file-input');
      const progress = document.getElementById('progress');
      const steps = document.querySelectorAll('#step-indicator span');

      btn.disabled = true;
      btn.textContent = '处理中...';

      // Step 1: Upload image
      steps[0].className = 'active';
      progress.textContent = '📤 上传图片到 IPFS...';
      let iconUrl = '';
      if (fileInput.files[0]) {
        try {
          const cid = await uploadToIPFS(fileInput.files[0]);
          iconUrl = `https://gateway.pinata.cloud/ipfs/${cid}`;
          steps[0].className = 'done';
          progress.textContent = '✅ 图片上传成功';
        } catch (e) {
          progress.textContent = '❌ 上传失败: ' + e.message;
          btn.disabled = false; btn.textContent = '✦ 生成发币代码';
          return;
        }
      } else {
        steps[0].className = 'done';
        progress.textContent = '⏭️ 跳过图片';
      }

      // Step 2: Generate Move code
      steps[1].className = 'active';
      progress.textContent = '📄 生成合约代码...';
      await new Promise(r => setTimeout(r, 300));

      // Generate unique module name
      const moduleName = 'token_' + Math.random().toString(36).substring(2, 8);

      const iconLine = iconUrl
        ? `let icon = url::new_unsafe_from_bytes(b"${iconUrl}"); option::some(icon)`
        : `option::none()`;

      const moveCode = `#[allow(deprecated_usage)]
module ${moduleName}::${moduleName} {
    use std::option;
    use sui::coin::{Self, Coin, TreasuryCap};
    use sui::transfer;
    use sui::tx_context::{Self, TxContext};
    use sui::url;

    struct ${symbol} has drop {}

    fun init(witness: ${symbol}, ctx: &mut TxContext) {
        let (treasury_cap, metadata) = coin::create_currency<${symbol}>(
            witness,
            ${decimals},
            b"${symbol}",
            b"${name}",
            b"${desc}",
            ${iconLine},
            ctx,
        );
        transfer::public_freeze_object(metadata);
        transfer::public_transfer(treasury_cap, tx_context::sender(ctx));
    }

    public fun mint(
        cap: &mut TreasuryCap<${symbol}>,
        amount: u64,
        recipient: address,
        ctx: &mut TxContext,
    ) {
        let coin = coin::mint(cap, amount, ctx);
        transfer::public_transfer(coin, recipient);
    }

    public fun burn(cap: &mut TreasuryCap<${symbol}>, coin: Coin<${symbol}>) {
        coin::burn(cap, coin);
    }
}`;

      steps[1].className = 'done';

      // Generate commands
      const projectDir = `sui_token_${moduleName}`;
      const cmd1 = `mkdir ${projectDir} && cd ${projectDir}`;
      const cmd2 = `echo '${moveCode.replace(/'/g, "'\\''")}' > sources/${moduleName}.move`;
      const cmd3 = `sui client publish --gas-budget 50000000`;
      const cmd4 = `sui client call --function mint --package <PACKAGE_ID> --module ${moduleName} --args <TREASURY_CAP_ID> ${supply}000000000 <YOUR_ADDRESS> --gas-budget 10000000`;

      const fullCmd = `# 1. 创建项目\nmkdir ${projectDir} && cd ${projectDir}\n\n# 2. 初始化\nsui move new ${moduleName}\n\n# 3. 写入合约\ncat > sources/${moduleName}.move << 'EOF'\n${moveCode}\nEOF\n\n# 4. 发币\nsui client publish --gas-budget 50000000\n\n# 5. 铸币（替换 <PACKAGE_ID> 和 <TREASURY_CAP_ID>）\nsui client call --function mint \\\\\n  --package <PACKAGE_ID> \\\\\n  --module ${moduleName} \\\\\n  --args <TREASURY_CAP_ID> ${supply}000000000 <YOUR_ADDRESS> \\\\\n  --gas-budget 10000000`;

      document.getElementById('cmd-text').textContent = fullCmd;
      document.getElementById('result').style.display = 'block';
      document.getElementById('explorer-link').innerHTML = '';

      steps[2].className = 'done';
      progress.textContent = '✅ 完成！复制命令在终端中运行';
      btn.disabled = false;
      btn.textContent = '✦ 重新生成';
    };

    // ====== 复制 ======
    function copyCmd() {
      const text = document.getElementById('cmd-text').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = '已复制 ✅';
        setTimeout(() => btn.textContent = '复制', 2000);
      });
    }
  </script>
</body>
</html>
