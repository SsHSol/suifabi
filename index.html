<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sui Token Creator - 一键发币</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      background: #07070a; color: #e8e8f0; min-height: 100vh;
    }
    .bg-glow {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(ellipse 80% 60% at 50% -20%, rgba(111,76,255,0.08) 0%, transparent 70%),
                  radial-gradient(ellipse 50% 40% at 80% 80%, rgba(99,102,241,0.06) 0%, transparent 60%);
    }
    .container { max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px; max-width: 640px; margin: 0 auto;
    }
    .logo {
      font-size: 20px; font-weight: 800;
      background: linear-gradient(135deg, #6f4cff, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .network-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
      background: rgba(34,197,94,0.1); color: #22c55e;
      border: 1px solid rgba(34,197,94,0.2);
    }
    .network-badge::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: #22c55e; display: inline-block;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 20px; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease; font-family: inherit;
    }
    .btn:active { transform: scale(0.97); }
    .btn-accent {
      background: linear-gradient(135deg, #6f4cff, #a78bfa);
      color: #fff; box-shadow: 0 0 24px rgba(111,76,255,0.2);
    }
    .btn-accent:hover { box-shadow: 0 0 32px rgba(111,76,255,0.35); transform: translateY(-1px); }
    .btn-accent:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost {
      background: rgba(255,255,255,0.06); color: #a0a0b8;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); color: #e8e8f0; }
    .card {
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px; padding: 24px; margin-bottom: 16px;
      backdrop-filter: blur(4px);
    }
    .card-title {
      display: flex; align-items: center; gap: 10px;
      font-size: 15px; font-weight: 700; color: #c8c8e0; margin-bottom: 20px;
    }
    .card-step {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border-radius: 8px;
      background: linear-gradient(135deg, #6f4cff, #a78bfa);
      font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .form-group { margin-bottom: 18px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-group label {
      display: block; font-size: 13px; font-weight: 500;
      color: #9898b0; margin-bottom: 6px;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 12px 14px;
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px; color: #e8e8f0; font-size: 14px;
      font-family: inherit; outline: none; transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus {
      border-color: rgba(111,76,255,0.4);
      box-shadow: 0 0 0 3px rgba(111,76,255,0.08);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-row-3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; }
    .upload-area {
      position: relative; border: 1.5px dashed rgba(255,255,255,0.1);
      border-radius: 12px; padding: 28px 16px;
      text-align: center; cursor: pointer; transition: border-color 0.2s;
    }
    .upload-area:hover { border-color: rgba(111,76,255,0.3); background: rgba(111,76,255,0.03); }
    .upload-area.has-file { border-color: rgba(34,197,94,0.3); background: rgba(34,197,94,0.03); }
    .upload-area input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .upload-icon {
      width: 40px; height: 40px; margin: 0 auto 10px;
      background: rgba(111,76,255,0.1); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .upload-text { font-size: 14px; font-weight: 500; color: #a0a0b8; }
    .upload-hint { display: block; font-size: 12px; color: #555570; margin-top: 6px; }
    .upload-preview {
      display: none; width: 64px; height: 64px; border-radius: 12px;
      object-fit: cover; margin: 0 auto 8px; border: 2px solid rgba(34,197,94,0.2);
    }
    .upload-area.has-file .upload-preview { display: block; }
    .upload-area.has-file .upload-icon { display: none; }
    .upload-area.has-file .upload-hint { display: none; }

    /* ===== 高级选项（开关） ===== */
    .toggle-row {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 0; cursor: pointer; user-select: none;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-row:first-child { padding-top: 0; }
    .toggle-info { flex: 1; }
    .toggle-title { font-size: 14px; font-weight: 600; color: #c8c8e0; }
    .toggle-desc { display: block; font-size: 12px; color: #686880; margin-top: 2px; }
    .toggle-switch {
      position: relative; width: 44px; height: 26px; flex-shrink: 0;
    }
    .toggle-switch input {
      position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; z-index: 2;
    }
    .toggle-track {
      position: absolute; inset: 0; border-radius: 13px;
      background: rgba(255,255,255,0.08); transition: background 0.25s;
    }
    .toggle-thumb {
      position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
      border-radius: 50%; background: #555570;
      transition: transform 0.25s, background 0.25s;
    }
    .toggle-switch input:checked ~ .toggle-track { background: rgba(111,76,255,0.4); }
    .toggle-switch input:checked ~ .toggle-thumb {
      transform: translateX(18px); background: #6f4cff;
    }

    /* ===== 按钮 ===== */
    .btn-create {
      width: 100%; padding: 16px; border: none; border-radius: 14px;
      background: linear-gradient(135deg, #6f4cff, #a78bfa);
      color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
      font-family: inherit; letter-spacing: 0.3px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 24px rgba(111,76,255,0.2);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-bottom: 20px;
    }
    .btn-create:hover:not(:disabled) { box-shadow: 0 6px 32px rgba(111,76,255,0.35); transform: translateY(-2px); }
    .btn-create:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-create .spinner {
      display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    .btn-create.loading .spinner { display: inline-block; }
    .btn-create.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .step-indicator {
      list-style: none; display: flex; justify-content: center; gap: 8px; margin-bottom: 12px;
    }
    .step-indicator li {
      font-size: 11px; font-weight: 600; color: #555570;
      padding: 4px 12px; border-radius: 20px;
      background: rgba(255,255,255,0.03); transition: all 0.3s;
    }
    .step-indicator li.active { color: #a78bfa; background: rgba(111,76,255,0.12); }
    .step-indicator li.done { color: #22c55e; background: rgba(34,197,94,0.1); }

    .progress-text {
      text-align: center; font-size: 14px; color: #a78bfa;
      margin-bottom: 16px; min-height: 22px; font-weight: 500;
    }
    .progress-text.done { color: #22c55e; }
    .progress-text.error { color: #ef4444; }

    .result-card {
      display: none; margin-top: 16px;
      background: linear-gradient(135deg, rgba(34,197,94,0.06), rgba(34,197,94,0.02));
      border: 1px solid rgba(34,197,94,0.15); border-radius: 16px; padding: 24px;
    }
    .result-card h3 {
      font-size: 18px; font-weight: 700; color: #22c55e; margin-bottom: 16px;
    }
    .result-table { width: 100%; margin-bottom: 16px; }
    .result-table td { padding: 6px 8px; font-size: 13px; vertical-align: top; }
    .result-table td:first-child { color: #686880; width: 80px; white-space: nowrap; }
    .result-table td:last-child { word-break: break-all; color: #c8c8e0; font-weight: 500; }
    .result-table a { color: #a78bfa; text-decoration: none; font-size: 13px; }
    .result-table a:hover { text-decoration: underline; }
    .result-table img { width: 36px; height: 36px; border-radius: 10px; border: 2px solid rgba(34,197,94,0.2); }

    .code-block {
      background: rgba(0,0,0,0.4); border: 1px solid rgba(111,76,255,0.15);
      border-radius: 10px; padding: 16px; margin-top: 12px;
      font-family: 'SF Mono', 'Consolas', monospace; font-size: 12px;
      color: #a78bfa; white-space: pre-wrap; word-break: break-all; line-height: 1.6;
      position: relative; max-height: 300px; overflow-y: auto;
    }
    .code-block .copy-btn {
      position: sticky; top: 0; float: right;
      padding: 4px 10px; border-radius: 6px;
      background: rgba(111,76,255,0.2); color: #a78bfa;
      border: none; font-size: 11px; cursor: pointer;
    }

    /* Wallet bar */
    .wallet-info {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px; margin-bottom: 20px;
      background: rgba(111,76,255,0.06); border: 1px solid rgba(111,76,255,0.15);
      border-radius: 14px;
    }
    .wallet-details { flex: 1; min-width: 0; }
    .wallet-name { font-size: 13px; font-weight: 600; color: #e8e8f0; }
    .wallet-addr { font-size: 12px; font-family: monospace; color: #a78bfa; }

    .footer { text-align: center; font-size: 12px; color: #383840; padding: 24px 0; }

    @media (max-width: 600px) {
      .container { padding: 16px 12px 40px; }
      .card { padding: 18px; }
      .form-row-3 { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <header>
    <div class="logo">✦ Sui Token Creator</div>
    <div class="header-right">
      <span class="network-badge">Mainnet</span>
      <button id="connect-btn" class="btn btn-accent">连接钱包</button>
    </div>
  </header>
  <main class="container">

    <!-- Wallet Info -->
    <div id="wallet-info" class="wallet-info" style="display:none">
      <div class="wallet-details">
        <div class="wallet-name">Sui Wallet</div>
        <span class="wallet-addr" id="wallet-addr-display"></span>
      </div>
      <button id="disconnect-btn" class="btn btn-ghost" style="font-size:12px;padding:6px 12px;">断开</button>
    </div>

    <!-- Card 1: Token Parameters -->
    <div class="card">
      <div class="card-title"><span class="card-step">1</span> 代币参数</div>
      <div class="form-group">
        <label>Token 名称</label>
        <input id="token-name" placeholder="例如: MyToken" value="MyToken" spellcheck="false">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Token 符号</label>
          <input id="token-symbol" placeholder="例如: MTK" value="MTK" spellcheck="false">
        </div>
        <div class="form-group">
          <label>精度</label>
          <input id="token-decimals" type="number" value="9" min="0" max="18">
        </div>
      </div>
      <div class="form-group">
        <label>供应量</label>
        <input id="token-supply" type="number" value="1000000000" min="1" step="any">
      </div>
      <div class="form-group">
        <label>Token Logo（可选）</label>
        <div class="upload-area" id="upload-area">
          <input type="file" id="token-image-file" accept="image/png,image/jpeg,image/gif,image/webp">
          <div class="upload-icon">🖼</div>
          <img class="upload-preview" id="upload-preview" alt="">
          <div class="upload-text" id="upload-text">点击上传图片</div>
          <span class="upload-hint">建议 250×250px · PNG/JPG/GIF/WEBP</span>
        </div>
      </div>
      <div class="form-group">
        <label>描述（可选）</label>
        <textarea id="token-desc" placeholder="描述你的代币..." rows="2" spellcheck="false"></textarea>
      </div>
    </div>

    <!-- Card 3: Advanced -->
    <div class="card">
      <div class="card-title"><span class="card-step">2</span> 高级选项</div>
      <label class="toggle-row">
        <div class="toggle-info">
          <div class="toggle-title">冻结元数据</div>
          <span class="toggle-desc">冻结后名称、符号、图标永久不可修改</span>
        </div>
        <div class="toggle-switch">
          <input type="checkbox" id="freeze-metadata" checked>
          <span class="toggle-track"></span>
          <span class="toggle-thumb"></span>
        </div>
      </label>
      <label class="toggle-row">
        <div class="toggle-info">
          <div class="toggle-title">保留铸币权</div>
          <span class="toggle-desc">保留后可以随时增发代币</span>
        </div>
        <div class="toggle-switch">
          <input type="checkbox" id="keep-mint">
          <span class="toggle-track"></span>
          <span class="toggle-thumb"></span>
        </div>
      </label>
    </div>

    <!-- Create Button -->
    <button id="create-btn" class="btn-create" disabled>
      <span class="btn-text">✦ 创建代币</span>
      <span class="spinner"></span>
    </button>

    <div id="progress-text" class="progress-text"></div>
    <ul class="step-indicator">
      <li>上传</li>
      <li>构建</li>
      <li>部署</li>
    </ul>

    <!-- Result -->
    <div id="result" class="result-card"></div>

    <div class="footer">Powered by Sui Network · Mainnet · 需安装 Sui CLI</div>
  </main>

  <script>
    // ====== Pinata JWT ======
    let PINATA_JWT = localStorage.getItem('pinata_jwt') || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySW5mb3JtYXRpb24iOnsiaWQiOiJiMmE3YzZhNi0zNDRkLTRjZjYtYTE3NC0yMjRiY2RlYmZhNmYiLCJlbWFpbCI6InNzaHp1aUBnbWFpbC5jb20iLCJlbWFpbF92ZXJpZmllZCI6dHJ1ZSwicGluX3BvbGljeSI6eyJyZWdpb25zIjpbeyJkZXNpcmVkUmVwbGljYXRpb25Db3VudCI6MSwiaWQiOiJGUkExIn0seyJkZXNpcmVkUmVwbGljYXRpb25Db3VudCI6MSwiaWQiOiJOWUMxIn1dLCJ2ZXJzaW9uIjoxfSwibWZhX2VuYWJsZWQiOmZhbHNlLCJzdGF0dXMiOiJBQ1RJVkUifSwiYXV0aGVudGljYXRpb25UeXBlIjoic2NvcGVkS2V5Iiwic2NvcGVkS2V5S2V5IjoiOTdlMWFlYjIzZWU1MDA2NDY5MmUiLCJzY29wZWRLZXlTZWNyZXQiOiI3YWUxZWNhZTc2OTJiZjE3NTg0NGFmNDUzMWViZmZhYzRhNDI3YTFjN2MwNDhkMzc2OTc0NzBmMWU3MzU2ZjcwIiwiZXhwIjoxODE2OTU5MzYwfQ.UGLnVpJxDyAuAvLKu0jYOUJb7w1KPF_gzmUjf6stFwA';

    // ====== 自动检测钱包 ======
    function detectWallets() {
      const found = [];
      // 检测所有已知钱包注入
      const checks = [
        { id: 'suiWallet', name: 'Sui Wallet', obj: window.suiWallet },
        { id: 'sui', name: 'Sui Wallet (alt)', obj: window.sui },
        { id: 'martian', name: 'Martian Wallet', obj: window.martian },
        { id: 'okx', name: 'OKX Wallet', obj: window.okxwallet?.sui },
        { id: 'tokenPocket', name: 'TokenPocket', obj: window.tokenPocket?.sui },
        { id: 'suiSnap', name: 'MetaMask Snap', obj: window.suiSnap },
      ];
      for (const c of checks) {
        if (c.obj && typeof c.obj === 'object') {
          found.push({ id: c.id, name: c.name, provider: c.obj });
        }
      }
      // 去重
      const seen = new Set();
      return found.filter(w => { const k = w.name; if (seen.has(k)) return false; seen.add(k); return true; });
    }

    let walletConnected = false;
    let walletAddr = '';

    // 页面加载时自动检测
    document.addEventListener('DOMContentLoaded', () => {
      const wallets = detectWallets();
      if (wallets.length > 0) {
        document.getElementById('connect-btn').textContent = `连接钱包 (${wallets.length})`;
      }
      // 调试：控制台输出钱包信息
      wallets.forEach(w => {
        const methods = Object.getOwnPropertyNames(w.provider).filter(k => typeof w.provider[k] === 'function');
        console.log(`🦊 ${w.name}:`, methods.join(', '));
      });
    });

    document.getElementById('connect-btn').onclick = async function() {
      const wallets = detectWallets();

      if (wallets.length === 0) {
        // 没检测到任何钱包，弹出安装引导
        const modal = document.createElement('div');
        modal.style.cssText = 'position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;';
        modal.innerHTML = `
          <div style="background:#0d0d18;border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:24px;max-width:380px;width:100%;">
            <h3 style="color:#e8e8f0;margin-bottom:16px;">没有检测到 Sui 钱包</h3>
            <p style="color:#9898b0;font-size:14px;margin-bottom:20px;line-height:1.6;">
              请安装以下浏览器扩展：
            </p>
            <div style="display:flex;flex-direction:column;gap:8px;">
              <a href="https://chrome.google.com/webstore/detail/sui-wallet/opcgpfmipidbgpenhmajoajpbobppdil" target="_blank" style="display:flex;align-items:center;gap:10px;padding:12px 16px;border:1px solid rgba(255,255,255,0.06);border-radius:12px;text-decoration:none;color:#e8e8f0;font-size:14px;">
                <span style="font-size:20px;">🦊</span> Sui Wallet (官方)
              </a>
              <a href="https://chrome.google.com/webstore/detail/sui-wallet/opcgpfmipidbgpenhmajoajpbobppdil" target="_blank" style="display:flex;align-items:center;gap:10px;padding:12px 16px;border:1px solid rgba(255,255,255,0.06);border-radius:12px;text-decoration:none;color:#e8e8f0;font-size:14px;">
                <span style="font-size:20px;">🔵</span> Martian Wallet
              </a>
            </div>
            <button onclick="this.closest('div[style]').remove()" style="width:100%;margin-top:16px;padding:12px;border:none;border-radius:10px;background:rgba(255,255,255,0.06);color:#686880;font-size:14px;cursor:pointer;">关闭</button>
          </div>
        `;
        document.body.appendChild(modal);
        return;
      }

      // 如果有多个钱包，弹出选择
      let walletProvider = wallets[0].provider;
      if (wallets.length > 1) {
        const chosen = await new Promise(resolve => {
          const modal = document.createElement('div');
          modal.style.cssText = 'position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;';
          modal.innerHTML = `
            <div style="background:#0d0d18;border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:24px;max-width:380px;width:100%;">
              <h3 style="color:#e8e8f0;margin-bottom:16px;">选择钱包</h3>
              ${wallets.map((w, i) => `
                <button data-idx="${i}" style="display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);border-radius:12px;color:#e8e8f0;font-size:15px;cursor:pointer;margin-bottom:8px;font-family:inherit;">
                  🦊 ${w.name}
                </button>
              `).join('')}
              <button onclick="this.closest('div[style]').remove();resolve(null)" style="width:100%;margin-top:8px;padding:12px;border:none;border-radius:10px;background:rgba(255,255,255,0.06);color:#686880;font-size:14px;cursor:pointer;font-family:inherit;">取消</button>
            </div>
          `;
          document.body.appendChild(modal);
          modal.querySelectorAll('button[data-idx]').forEach(btn => {
            btn.onclick = () => { modal.remove(); resolve(wallets[parseInt(btn.dataset.idx)]); };
          });
        });
        if (!chosen) return;
        walletProvider = chosen.provider;
      }

      // 连接（兼容所有钱包版本）
      try {
        let accounts = [];

        // 方法1: requestPermissions（legacy）
        if (walletProvider.requestPermissions) {
          const permResult = await walletProvider.requestPermissions();
          // 有些钱包直接返回账户信息
          if (permResult?.accounts) {
            accounts = permResult.accounts;
          }
        }

        // 方法2: getAccounts
        if (accounts.length === 0 && walletProvider.getAccounts) {
          accounts = await walletProvider.getAccounts();
        }

        // 方法3: Wallet Standard connect
        if (accounts.length === 0 && walletProvider.features?.['standard:connect']) {
          const conn = await walletProvider.features['standard:connect'].connect();
          accounts = conn.accounts?.map(a => a.address) || [];
        }

        // 方法4: 直接读属性
        if (accounts.length === 0 && walletProvider.accounts) {
          accounts = Array.isArray(walletProvider.accounts) ? walletProvider.accounts : [walletProvider.accounts];
        }

        if (accounts.length === 0) throw new Error('无法获取钱包地址');
        walletAddr = accounts[0];
        walletConnected = true;
        document.getElementById('wallet-addr-display').textContent = walletAddr;
        document.getElementById('wallet-info').style.display = 'flex';
        document.getElementById('connect-btn').textContent = '已连接 ✓';
        document.getElementById('connect-btn').style.opacity = '0.6';
        document.getElementById('create-btn').disabled = false;
      } catch (e) {
        alert('连接失败: ' + e.message);
      }
    };

    document.getElementById('disconnect-btn').onclick = function() {
      walletConnected = false;
      walletAddr = '';
      document.getElementById('wallet-info').style.display = 'none';
      document.getElementById('connect-btn').textContent = '连接钱包';
      document.getElementById('connect-btn').style.opacity = '1';
      document.getElementById('create-btn').disabled = true;
    };

    // ====== Image upload preview ======
    document.getElementById('token-image-file').onchange = function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        document.getElementById('upload-preview').src = ev.target.result;
        document.getElementById('upload-area').classList.add('has-file');
        document.getElementById('upload-text').textContent = file.name;
      };
      reader.readAsDataURL(file);
    };

    // ====== Upload to Pinata ======
    async function uploadToIPFS(file) {
      const form = new FormData();
      form.append('file', file);
      const res = await fetch('https://api.pinata.cloud/pinning/pinFileToIPFS', {
        method: 'POST',
        headers: { Authorization: `Bearer ${PINATA_JWT}` },
        body: form,
      });
      if (!res.ok) throw new Error('Pinata 上传失败');
      const data = await res.json();
      return data.IpfsHash;
    }

    // ====== Create Token ======
    document.getElementById('create-btn').onclick = async function() {
      const btn = this;
      const name = document.getElementById('token-name').value.trim() || 'MyToken';
      const symbol = document.getElementById('token-symbol').value.trim() || 'MTK';
      const decimals = document.getElementById('token-decimals').value || 9;
      const supply = document.getElementById('token-supply').value || '1000000000';
      const desc = document.getElementById('token-desc').value.trim() || name;
      const fileInput = document.getElementById('token-image-file');
      const freezeMeta = document.getElementById('freeze-metadata').checked;
      const keepMint = document.getElementById('keep-mint').checked;

      const progress = document.getElementById('progress-text');
      const steps = document.querySelectorAll('.step-indicator li');
      const resultBox = document.getElementById('result');

      btn.disabled = true;
      btn.classList.add('loading');
      progress.className = 'progress-text';
      resultBox.style.display = 'none';

      try {
        // Step 1: Upload image
        steps[0].className = 'active';
        progress.textContent = '📤 上传图片到 IPFS...';
        let iconCid = '';
        if (fileInput.files[0]) {
          if (!PINATA_JWT) throw new Error('请先填写 Pinata JWT（文件顶部）');
          iconCid = await uploadToIPFS(fileInput.files[0]);
          progress.textContent = `✅ 图片上传成功`;
        } else {
          progress.textContent = `⏭️ 跳过图片`;
        }
        await sleep(300);
        steps[0].className = 'done';

        // Step 2: Generate code
        steps[1].className = 'active';
        progress.textContent = '📄 生成发币代码...';
        await sleep(500);

        const iconUrl = iconCid ? `https://gateway.pinata.cloud/ipfs/${iconCid}` : '';
        const randomStr = Math.random().toString(36).substring(2, 8);
        const moduleName = `token_${randomStr}`;

        const iconLine = iconUrl
          ? `option::some(url::new_unsafe_from_bytes(b"${iconUrl}"))`
          : `option::none()`;

        const deployScript = `#!/bin/bash
# Sui Token Creator - 一键发币
# 生成的部署脚本 - ${new Date().toISOString()}

# 确保使用主网
sui client switch --env mainnet 2>/dev/null

NAME="${name}"
SYMBOL="${symbol}"
DECIMALS=${decimals}
SUPPLY=${supply}

# 1. 创建项目
echo "📁 创建项目..."
mkdir -p ${moduleName}/sources
cd ${moduleName}

# 2. 创建 Move.toml
cat > Move.toml << 'TOMLEOF'
[package]
name = "${moduleName}"
version = "1.0.0"
[addresses]
${moduleName} = "0x0"
TOMLEOF

# 3. 写入合约
cat > sources/${moduleName}.move << 'MOVEOF'
#[allow(deprecated_usage)]
module ${moduleName}::${moduleName} {
    use std::option;
    use sui::coin::{Self, Coin, TreasuryCap};
    use sui::transfer;
    use sui::tx_context::{Self, TxContext};
    use sui::url;

    struct ${symbol} has drop {}

    fun init(witness: ${symbol}, ctx: &mut TxContext) {
        let (treasury_cap, metadata) = coin::create_currency<${symbol}>(
            witness,
            ${decimals},
            b"${symbol}",
            b"${name}",
            b"${desc}",
            ${iconLine},
            ctx,
        );
        ${freezeMeta ? 'transfer::public_freeze_object(metadata);' : ''}
        transfer::public_transfer(treasury_cap, tx_context::sender(ctx));
    }

    public fun mint(cap: &mut TreasuryCap<${symbol}>, amount: u64, recipient: address, ctx: &mut TxContext) {
        let coin = coin::mint(cap, amount, ctx);
        transfer::public_transfer(coin, recipient);
    }
}
MOVEOF

echo "✅ 合约代码已生成"

# 4. 编译
echo "🔨 编译..."
sui move build
if [ $? -ne 0 ]; then echo "❌ 编译失败"; exit 1; fi
echo "✅ 编译成功"

# 5. 发布
echo "🚀 发布..."
PUBLISH_OUTPUT=\$(sui client publish --gas-budget 50000000)
echo "\$PUBLISH_OUTPUT"

# 6. 获取钱包地址
	MY_ADDR=$(sui client active-address 2>/dev/null | tail -1)
	[ -z "$MY_ADDR" ] && MY_ADDR=$(sui client active-address)
	echo "👤 钱包: $MY_ADDR"

	# 7. 解析 PackageID 和 TreasuryCap
	PACKAGE_ID=$(echo "$PUBLISH_OUTPUT" | grep "PackageID:" | awk '{print $NF}')
	TREASURY_ID=$(echo "$PUBLISH_OUTPUT" | grep "TreasuryCap<" | grep -o '0x[a-f0-9]*' | tail -1)

	if [ -n "$PACKAGE_ID" ]; then echo "📦 PackageID: $PACKAGE_ID"; fi

	if [ -n "$TREASURY_ID" ]; then
	  echo "🔑 TreasuryCap: $TREASURY_ID"
	  echo ""
	  echo "⏳ 铸币 ${supply} 到 $MY_ADDR..."
	  sui client call --function mint \n	    --package $PACKAGE_ID \n	    --module ${moduleName} \n	    --args $TREASURY_ID ${supply}000000000 $MY_ADDR \n	    --gas-budget 10000000
	  echo "✅ 铸币完成！"
	else
	  echo "⚠️ 未找到 TreasuryCap，发布后手动铸币"
	fi
echo ""
echo "🎉 完成！查看 Sui Explorer:"
echo "   https://suivision.xyz/package/\$PACKAGE_ID"`;

        // Show deploy script
        steps[1].className = 'done';
        steps[2].className = 'active';
        progress.textContent = '📋 部署命令已生成，复制并在终端运行';
        progress.className = 'progress-text done';

        resultBox.innerHTML = `
          <h3>✅ 已生成部署脚本</h3>
          <p style="font-size:13px;color:#9898b0;margin-bottom:12px;">
            复制以下命令到终端运行，或用下载的脚本一键部署
          </p>
          <div class="code-block">
            <button class="copy-btn" onclick="copyCode()">复制</button>
            <pre style="margin:0;white-space:pre-wrap;">${deployScript}</pre>
          </div>
          <div style="margin-top:12px;font-size:12px;color:#686880;line-height:1.8;">
            <div>📌 需要先安装 <b>Sui CLI</b></div>
            <div>📌 需要连接钱包</div>
            <div>📌 代币名: <b>${name}</b> · 符号: <b>${symbol}</b> · 精度: <b>${decimals}</b></div>
            ${iconUrl ? `<div>🖼️ 头像: <a href="${iconUrl}" target="_blank">查看</a></div>` : ''}
          </div>
        `;
        resultBox.style.display = 'block';
        steps[2].className = 'done';

      } catch (e) {
        progress.textContent = '❌ ' + e.message;
        progress.className = 'progress-text error';
      }

      btn.disabled = false;
      btn.classList.remove('loading');
    };

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function copyCode() {
      const text = document.querySelector('.code-block pre').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = '✅ 已复制';
        setTimeout(() => btn.textContent = '复制', 2000);
      });
    }
  </script>
</body>
</html>
