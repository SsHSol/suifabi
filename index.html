<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sui Token Creator - 一键发币</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#07070a;color:#e8e8f0;min-height:100vh}
.bg-glow{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 50% -20%,rgba(111,76,255,0.08) 0%,transparent 70%)}
.container{max-width:640px;margin:0 auto;padding:24px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;max-width:640px;margin:0 auto}
.logo{font-size:20px;font-weight:800;background:linear-gradient(135deg,#6f4cff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.network-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;background:rgba(34,197,94,0.1);color:#22c55e;border:1px solid rgba(34,197,94,0.2)}
.network-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block}
.card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:24px;margin-bottom:16px}
.card-title{font-size:15px;font-weight:700;color:#c8c8e0;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.card-step{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,#6f4cff,#a78bfa);font-size:11px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:13px;font-weight:500;color:#9898b0;margin-bottom:6px}
.form-group input,.form-group textarea{width:100%;padding:12px 14px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.07);border-radius:10px;color:#e8e8f0;font-size:14px;font-family:inherit;outline:none}
.form-group input:focus,.form-group textarea:focus{border-color:rgba(111,76,255,0.4)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.upload-area{border:1.5px dashed rgba(255,255,255,0.1);border-radius:12px;padding:28px 16px;text-align:center;cursor:pointer}
.upload-area:hover{border-color:rgba(111,76,255,0.3)}
.upload-area input[type="file"]{display:none}
.upload-icon{font-size:32px;margin-bottom:8px}
.preview{width:80px;height:80px;border-radius:16px;object-fit:cover;margin:0 auto 8px;display:none;border:2px solid rgba(111,76,255,0.3)}
.btn-create{width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(135deg,#6f4cff,#a78bfa);color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.25s;margin-bottom:20px}
.btn-create:hover{transform:translateY(-1px);box-shadow:0 4px 24px rgba(111,76,255,0.3)}
.btn-create:disabled{opacity:0.4;cursor:not-allowed}
.btn-create.loading .btn-text{display:none}
.btn-create .spinner{display:none;width:18px;height:18px;border:2px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto}
.btn-create.loading .spinner{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.steps{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.steps span{font-size:11px;padding:4px 12px;border-radius:20px;background:rgba(255,255,255,0.03);color:#555570}
.steps span.active{background:rgba(111,76,255,0.12);color:#a78bfa}
.steps span.done{background:rgba(34,197,94,0.1);color:#22c55e}
.progress{text-align:center;font-size:14px;color:#a78bfa;margin-bottom:12px;min-height:22px}
.footer{text-align:center;font-size:12px;color:#383840;padding:24px 0}
.result{display:none;margin-top:16px;background:linear-gradient(135deg,rgba(34,197,94,0.06),rgba(34,197,94,0.02));border:1px solid rgba(34,197,94,0.15);border-radius:16px;padding:24px}
.result h3{font-size:18px;font-weight:700;color:#22c55e;margin-bottom:16px}
.result a{color:#a78bfa;text-decoration:none}
.download-btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#6f4cff,#a78bfa);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:12px}
.info{font-size:12px;color:#686880;line-height:1.8;padding:12px;background:rgba(0,0,0,0.2);border-radius:10px}
@media(max-width:600px){.container{padding:16px 12px 40px}.card{padding:18px}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<header><div class="logo">✦ Sui Token Creator</div><span class="network-badge">Mainnet</span></header>
<main class="container">
<div class="card">
<div class="card-title"><span class="card-step">1</span> 代币参数</div>
<div class="form-group"><label>名称</label><input id="name" value="MyToken"></div>
<div class="form-row">
<div class="form-group"><label>符号</label><input id="symbol" value="MTK"></div>
<div class="form-group"><label>精度</label><input id="decimals" type="number" value="9" min="0" max="18"></div>
</div>
<div class="form-group"><label>供应量</label><input id="supply" type="number" value="1000000000"></div>
<div class="form-group"><label>头像</label><div class="upload-area" onclick="document.getElementById('file').click()">
<input type="file" id="file" accept="image/*">
<img class="preview" id="preview"><div class="upload-icon" id="uploadIcon">🖼️</div><div style="font-size:13px;color:#9898b0;">点击上传</div></div></div>
<div class="form-group"><label>描述</label><textarea id="desc" rows="2"></textarea></div>
</div>

<button id="createBtn" class="btn-create"><span class="btn-text">✦ 生成发币脚本</span><span class="spinner"></span></button>
<div class="progress" id="progress"></div>
<div class="steps"><span>上传</span><span>生成</span></div>

<div class="result" id="result"></div>
<div class="footer">需安装 Sui CLI · 脚本在桌面运行</div>
</main>
<script>
const PINATA_JWT = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySW5mb3JtYXRpb24iOnsiaWQiOiJiMmE3YzZhNi0zNDRkLTRjZjYtYTE3NC0yMjRiY2RlYmZhNmYiLCJlbWFpbCI6InNzaHp1aUBnbWFpbC5jb20iLCJlbWFpbF92ZXJpZmllZCI6dHJ1ZSwicGluX3BvbGljeSI6eyJyZWdpb25zIjpbeyJkZXNpcmVkUmVwbGljYXRpb25Db3VudCI6MSwiaWQiOiJGUkExIn0seyJkZXNpcmVkUmVwbGljYXRpb25Db3VudCI6MSwiaWQiOiJOWUMxIn1dLCJ2ZXJzaW9uIjoxfSwibWZhX2VuYWJsZWQiOmZhbHNlLCJzdGF0dXMiOiJBQ1RJVkUifSwiYXV0aGVudGljYXRpb25UeXBlIjoic2NvcGVkS2V5Iiwic2NvcGVkS2V5S2V5IjoiOTdlMWFlYjIzZWU1MDA2NDY5MmUiLCJzY29wZWRLZXlTZWNyZXQiOiI3YWUxZWNhZTc2OTJiZjE3NTg0NGFmNDUzMWViZmZhYzRhNDI3YTFjN2MwNDhkMzc2OTc0NzBmMWU3MzU2ZjcwIiwiZXhwIjoxODE2OTU5MzYwfQ.UGLnVpJxDyAuAvLKu0jYOUJb7w1KPF_gzmUjf6stFwA';

document.getElementById('file').onchange = function(e) {
const f = e.target.files[0]; if(!f)return;
const r = new FileReader(); r.onload=ev=>{document.getElementById('preview').src=ev.target.result;document.getElementById('preview').style.display='block';document.getElementById('uploadIcon').style.display='none'}; r.readAsDataURL(f);
};

document.getElementById('createBtn').onclick = async function() {
const btn = this; const progress = document.getElementById('progress');
const steps = document.querySelectorAll('.steps span');
const resultBox = document.getElementById('result');
const name = document.getElementById('name').value.trim()||'MyToken';
const symbol = document.getElementById('symbol').value.trim()||'MTK';
const decimals = document.getElementById('decimals').value||9;
const supply = document.getElementById('supply').value||'1000000000';
const desc = document.getElementById('desc').value.trim()||name;
const fileInput = document.getElementById('file');
btn.disabled=true; btn.classList.add('loading'); resultBox.style.display='none';

try {
steps[0].className='active'; progress.textContent='📤 上传...';
let iconUrl = '';
if(fileInput.files[0]){
if(!PINATA_JWT) throw new Error('Pinata JWT 未配置');
const fd = new FormData(); fd.append('file',fileInput.files[0]);
const r = await fetch('https://api.pinata.cloud/pinning/pinFileToIPFS',{method:'POST',headers:{Authorization:'Bearer '+PINATA_JWT},body:fd});
const d = await r.json(); iconUrl = 'https://gateway.pinata.cloud/ipfs/'+d.IpfsHash;
} else { progress.textContent = '⏭️ 无头像'; }
steps[0].className='done';
await sleep(300);

steps[1].className='active'; progress.textContent='📄 生成脚本...';
await sleep(300);

const modName = 't'+Math.random().toString(36).substring(2,8);
const iconLine = iconUrl ? 'option::some(url::new_unsafe_from_bytes(b"'+iconUrl+'"))' : 'option::none()';
const suiBin = 'C:\\Users\\z\\sui\\bin\\sui.exe';
const outputDir = 'sui_'+name+'_'+Date.now();

const ps1 = `# Sui Token Creator - 一键发币
# 下载后右键 -> 使用 PowerShell 运行
param([switch]$$Auto)

$$ErrorActionPreference = "Stop"
$$SUI = "${suiBin}"
$$NAME = "${name}"
$$SYMBOL = "${symbol}"
$$DECIMALS = ${decimals}
$$SUPPLY = ${supply}
$$DESC = "${desc}"
$$MODULE = "${modName}"
$$DIR = "${outputDir}"

Write-Host "🚀 Sui 一键发币" -ForegroundColor Cyan
Write-Host ""

# 切主网
& $$SUI client switch --env mainnet 2>$$null

# 建项目
New-Item -ItemType Directory -Force -Path "$$DIR\\sources" | Out-Null
Set-Location $$DIR

# Move.toml
@"[package]
name = "$$MODULE"
version = "1.0.0"
[addresses]
$$MODULE = "0x0"
"@ | Out-File -Encoding utf8 Move.toml

# Move 源码
@"
#[allow(deprecated_usage)]
module $$MODULE::$$MODULE {
    use std::option;
    use sui::coin::{Self, Coin, TreasuryCap};
    use sui::transfer;
    use sui::tx_context::{Self, TxContext};
    use sui::url;

    struct $$SYMBOL has drop {}

    fun init(witness: $$SYMBOL, ctx: &mut TxContext) {
        let (treasury_cap, metadata) = coin::create_currency<$$SYMBOL>(
            witness,
            $$DECIMALS,
            b"$$SYMBOL",
            b"$$NAME",
            b"$$DESC",
            ${iconLine},
            ctx,
        );
        transfer::public_freeze_object(metadata);
        transfer::public_transfer(treasury_cap, tx_context::sender(ctx));
    }
}
"@ | Out-File -Encoding utf8 "sources\\$$MODULE.move"

Write-Host "📁 项目已创建" -ForegroundColor Green

# 编译
Write-Host "🔨 编译..." -ForegroundColor Yellow
$$build = & $$SUI move build 2>&1 | Out-String
if ($$LASTEXITCODE -ne 0) { Write-Host "❌ 编译失败`n$$build" -ForegroundColor Red; Read-Host; exit }

Write-Host "✅ 编译成功" -ForegroundColor Green

# 发布
Write-Host "🚀 发布到主网..." -ForegroundColor Yellow
$$output = & $$SUI client publish --gas-budget 50000000 2>&1 | Out-String
Write-Host "$$output"

# 解析结果
$$pkId = ($$output | Select-String "PackageID:").ToString() -replace '.*PackageID:\\s*',''
$$tcId = ($$output | Select-String "TreasuryCap<").ToString()
if ($$tcId -match '0x[a-f0-9]+') { $$tcId = $$matches[0] }

Write-Host ""
Write-Host "📦 PackageID: $$pkId" -ForegroundColor Cyan

# 铸币
if ($$tcId) {
    $$addr = & $$SUI client active-address 2>&1 | Select-Object -Last 1
    Write-Host "🔑 TreasuryCap: $$tcId" -ForegroundColor Cyan
    Write-Host "👤 钱包: $$addr" -ForegroundColor Cyan
    Write-Host "⏳ 铸币 $$SUPPLY..." -ForegroundColor Yellow
    & $$SUI client call --function mint --package $$pkId --module $$MODULE --args $$tcId $$SUPPLY`000000000 $$addr --gas-budget 10000000
    Write-Host "✅ 铸币完成！" -ForegroundColor Green
}

Write-Host "`n🎉 完成！Sui Explorer:" -ForegroundColor Green
Write-Host "https://suivision.xyz/package/$$pkId" -ForegroundColor Cyan
Write-Host "`n按回车退出" -ForegroundColor Gray
Read-Host
`;

// Download
const blob = new Blob(['\ufeff'+ps1], {type: 'text/plain;charset=utf-8'});
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url; a.download = `deploy_${name}_${symbol}.ps1`;
a.click();
URL.revokeObjectURL(url);

steps[1].className='done';
progress.textContent='✅ 脚本已下载！';
resultBox.style.display='block';
resultBox.innerHTML =
'<h3>✅ 部署脚本已下载</h3>'+
'<div style="font-size:14px;margin-bottom:16px;">找到下载的 <b>deploy_'+name+'_'+symbol+'.ps1</b> 文件</div>'+
'<div style="padding:14px;background:rgba(0,0,0,0.3);border-radius:12px;margin-bottom:12px;font-size:13px;line-height:1.8;">'+
'<div>1. 右键 → <b>使用 PowerShell 运行</b></div>'+
'<div>2. 等待编译、发布、铸币</div>'+
'<div>3. 完成后自动打开浏览器查看</div>'+
'</div>'+
'<div class="info">代币: <b>'+name+'</b> ('+symbol+') · '+decimals+'位精度</div>';

} catch(e) {
progress.textContent='❌ '+e.message;
}
btn.disabled=false; btn.classList.remove('loading');
};

function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
</script>
</body>
</html>
